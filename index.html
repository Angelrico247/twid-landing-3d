<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>VOXEL — Digital Studio</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;700&display=swap" rel="stylesheet">
<style>
  :root {
    --bg-top: #7a60ee;
    --bg-bottom: #a58bfb;
    --ink: #ffffff;
    --line: rgba(255, 255, 255, .28);
    --yellow: #ffd60a;
    --dark: #14102e;
  }
  * { box-sizing: border-box; margin: 0; }
  html, body { height: 100%; }
  body {
    font-family: "Space Grotesk", system-ui, sans-serif;
    color: var(--ink);
    background: linear-gradient(180deg, var(--bg-top) 0%, #8f77f6 60%, var(--bg-bottom) 100%);
    overflow-x: hidden;
  }

  .hero {
    position: relative;
    min-height: 100vh;
    padding: 0 clamp(20px, 3vw, 44px);
    display: grid;
    grid-template-rows: auto 1fr auto;
    isolation: isolate;
  }

  /* lineas verticales de la cuadricula */
  .hero::before {
    content: "";
    position: absolute; inset: 0; z-index: -1;
    background:
      linear-gradient(var(--line), var(--line)) 22% 0 / 1px 100% no-repeat,
      linear-gradient(var(--line), var(--line)) 78% 0 / 1px 100% no-repeat;
    opacity: .55;
    pointer-events: none;
  }

  /* barra superior */
  header {
    display: grid;
    grid-template-columns: 1fr auto 1fr auto;
    align-items: center;
    gap: 24px;
    height: 76px;
    font-size: 12px;
    letter-spacing: .12em;
    text-transform: uppercase;
  }
  .logo { font-size: 20px; letter-spacing: .04em; font-weight: 500; }
  .est { justify-self: center; }
  .menu { justify-self: end; display: flex; gap: 14px; align-items: center; cursor: pointer; }
  .menu i { width: 7px; height: 7px; background: #fff; display: inline-block; }
  .dots { display: grid; grid-template-columns: repeat(4, 8px); gap: 3px; }
  .dots i { width: 8px; height: 8px; background: #fff; }
  .dots i:nth-child(3n) { opacity: 0; }

  /* contenido */
  .stage { position: relative; display: grid; align-items: center; }

  h1 {
    position: relative; z-index: 2;
    font-weight: 500;
    font-size: clamp(54px, 9.2vw, 150px);
    line-height: .92;
    letter-spacing: -.02em;
    text-transform: uppercase;
    max-width: 8.5em;
  }
  h1 .indent { display: block; padding-left: .55em; position: relative; }
  h1 .arrow {
    position: absolute; left: .02em; top: .32em;
    font-size: .26em; line-height: 1;
  }

  .cube {
    position: absolute;
    right: -2%; top: 50%;
    width: min(62vw, 86vh);
    aspect-ratio: 1;
    transform: translateY(-50%);
    z-index: 1;
    pointer-events: none;
  }
  .cube video { width: 100%; height: 100%; object-fit: contain; display: block; }

  /* parte inferior */
  .bottom {
    position: relative; z-index: 3;
    display: grid;
    grid-template-columns: 22% 1fr auto;
    align-items: end;
    gap: 24px;
    padding-bottom: 28px;
    font-size: 12px;
    letter-spacing: .1em;
    text-transform: uppercase;
  }
  .explore { display: flex; gap: 12px; align-items: center; }
  .explore::before { content: ""; width: 14px; height: 1px; background: #fff; }
  .lead {
    max-width: 22em;
    text-transform: none; letter-spacing: 0;
    font-size: 15px; line-height: 1.45;
    padding-left: 18px; border-left: 1px solid var(--line);
  }

  .news {
    width: min(300px, 80vw);
    background: var(--yellow);
    color: #111;
    border-radius: 14px 14px 0 0;
    padding: 18px 20px 14px;
    text-transform: none; letter-spacing: 0;
    margin-right: calc(-1 * clamp(20px, 3vw, 44px));
    margin-bottom: -28px;
    position: relative;
  }
  .news h3 { font-weight: 500; font-size: 34px; line-height: .95; text-transform: uppercase; }
  .news .go { position: absolute; right: 18px; top: 14px; font-size: 22px; }
  .news ul { list-style: none; padding: 0; margin-top: 16px; font-size: 13px; }
  .news li { display: flex; justify-content: space-between; gap: 10px; padding: 10px 0; border-top: 1px solid rgba(0,0,0,.25); }
  .news li::after { content: "\25C6"; font-size: 9px; align-self: center; }

  .sound { position: absolute; left: 0; bottom: 28px; display: none; }

  /* movil */
  @media (max-width: 820px) {
    header { grid-template-columns: 1fr auto; }
    .dots, .est { display: none; }
    .hero::before { background-position: 8% 0, 92% 0; }
    .stage { align-content: start; padding-top: 24px; }
    .cube { position: relative; right: auto; top: auto; transform: none; width: 112%; margin: -8% -6% 0; }
    h1 { font-size: clamp(46px, 14.5vw, 80px); }
    .bottom { grid-template-columns: 1fr; gap: 14px; }
    .lead { border-left: 0; padding-left: 0; }
    .news { margin: 0 0 -28px auto; }
  }

  @media (prefers-reduced-motion: reduce) { .cube video { display: none; } }
</style>
</head>
<body>

<section class="hero">
  <header>
    <div class="logo">VOXEL</div>
    <div class="dots" aria-hidden="true"><i></i><i></i><i></i><i></i><i></i><i></i><i></i><i></i></div>
    <div class="est">Est. 2025</div>
    <div class="menu">Menu <span><i></i> <i></i></span></div>
  </header>

  <div class="stage">
    <h1>
      Shaping
      <span class="indent"><span class="arrow">&#8600;</span>Digital</span>
      Ideas
    </h1>

    <div class="cube" aria-hidden="true">
      <video autoplay loop muted playsinline preload="auto" poster="frames_final/f_0001.png">
        <source src="cube_wave.webm" type="video/webm">
        <source src="cube_wave.mp4" type="video/mp4">
      </video>
    </div>
  </div>

  <div class="bottom">
    <div class="explore">Explore</div>
    <p class="lead">Somos una agencia digital enfocada en la mejor tecnolog&iacute;a y en ideas innovadoras para el mundo.</p>
    <aside class="news">
      <span class="go">&#8599;</span>
      <h3>Voxel<br>News</h3>
      <ul>
        <li>Nuevo estudio abre en 2026</li>
        <li>Lanzamos nuestra plataforma 3D</li>
      </ul>
    </aside>
  </div>
</section>

</body>
</html>
